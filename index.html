<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priorities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#101114;--fg:#eef0f4;--mu:#8a8f9c;--ln:#23252b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Sora',system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:16px 20px}
header h1{font-size:15px;font-weight:600;flex:1;display:flex;align-items:center;gap:10px}
.back{background:none;border:0;color:var(--mu);font:inherit;font-size:20px;cursor:pointer;padding:0 4px}
.ov{font-size:13px;color:var(--mu)} .ov b{color:var(--fg);font-size:18px;font-weight:700}
button.t{background:none;border:1px solid var(--ln);color:var(--fg);font:inherit;font-size:12px;padding:7px 13px;border-radius:99px;cursor:pointer}
button.t:hover,button.t.on{background:var(--fg);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;background:#d9a441;cursor:pointer}
.dot.ok{background:#5fb87a}.dot.err{background:#d9534f}
main{flex:1;position:relative;margin:0 20px 20px;min-height:0}
.tile{position:absolute;padding:3px}
.tile>div{height:100%;border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden;transition:filter .15s}
.tile>div:hover{filter:brightness(1.18)}
.tile .n{font-weight:600;line-height:1.15}.tile .p{font-weight:700;line-height:1}.tile .s{opacity:.75;font-weight:400}
.list{max-width:640px;margin:0 auto;overflow:auto;height:100%;padding:3px 6px}
.row{display:grid;grid-template-columns:1fr 64px 64px 28px 28px;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);align-items:center}
.row.h{color:var(--mu);font-size:11px}
input{background:#181a1f;border:1px solid var(--ln);color:var(--fg);font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;width:100%}
input:disabled{opacity:.5}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}
.add{margin:16px 0}
.tot{color:var(--mu);font-size:12px;margin-top:6px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#16181d;border:1px solid var(--ln);border-radius:14px;padding:24px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.6}
.box a{color:var(--fg)}.box p{color:var(--mu)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.gal{overflow:auto;height:100%;padding:3px 6px}
.mas{columns:220px;column-gap:10px}
.im{break-inside:avoid;margin-bottom:10px;position:relative}
.im img{width:100%;display:block;border-radius:10px}
.ph{height:140px;background:#181a1f;border-radius:10px}
.rm{position:absolute;top:6px;right:6px;background:#000a;color:#fff;width:26px;height:26px;border-radius:50%;font-size:16px;line-height:1;padding:0}
.ic{padding:7px 9px;display:flex;align-items:center}

.tile{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile.hold>div{transform:scale(.95);transition:transform 3s linear}
.tile.drag{opacity:.35}
.tile.tgt>div{outline:3px solid #fff;outline-offset:-3px;filter:brightness(1.25)}
.ghost{position:fixed;z-index:20;transform:translate(-50%,-50%) scale(1.04);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px #000a;pointer-events:none;max-width:60vw}

.ds{display:block;width:100%;height:calc(100% - 6px);resize:none;background:#181a1f;border:1px solid var(--ln);color:var(--fg);font:inherit;font-size:15px;line-height:1.7;padding:16px;border-radius:12px}

.fcard{border-radius:12px;padding:18px;margin-bottom:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.fcard:hover{filter:brightness(1.12)}
.fcard.top{padding:30px 20px}
.fc-ch{font-size:12px;opacity:.7}
.fc-n{font-weight:600;font-size:18px;line-height:1.2}
.fcard.top .fc-n{font-size:26px}
.fc-s{font-size:13px;opacity:.75}
.fcd{border-radius:14px;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.fcd .fc-n{font-size:30px}
.stp{display:flex;align-items:center;gap:14px}
.stp b{font-size:34px;min-width:2.4ch;text-align:center}
.stp .t{font-size:20px;width:40px;height:40px;justify-content:center}
.fdesc{white-space:pre-wrap;opacity:.85;line-height:1.7;font-size:14px}
</style>
</head>
<body>
<header id="hd"></header>
<main id="mn"></main>
<div id="md"></div>
<script>
const $=s=>document.querySelector(s), LS=localStorage, FILE='priorities.json', GH='https://api.github.com';
const uid=()=>Math.random().toString(36).slice(2,9);
const mk=(n,w)=>({id:uid(),name:n,w,s:5,subs:[]});
let data;
try{data=JSON.parse(LS.getItem('pri_data'))}catch(e){}
if(!data)data={updated:0,items:['Health','Wealth','Relationships','Work','Growth'].map(n=>mk(n,20))};
let path=[], ten=false, desc=false, edit=false, focus=LS.getItem('pri_focus')==='1', timer, status='wait';
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

const cur=()=>{let n=null,l=data.items;for(const id of path){n=l.find(i=>i.id===id);if(!n)return null;l=n.subs}return n};
const list=()=>path.length?cur().subs:data.items;
const score=i=>i.subs.length?i.subs.reduce((a,c)=>a+c.w*score(c),0)/(i.subs.reduce((a,c)=>a+c.w,0)||1):i.s;
const overall=()=>data.items.reduce((a,c)=>a+c.w*score(c),0)/(data.items.reduce((a,c)=>a+c.w,0)||1);
const fmt=n=>(Math.round(n*10)/10).toString();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// keep every list totalling exactly 100
function balance(l,keep,target){
  const others=l.filter(x=>x!==keep), rest=100-(keep?keep.w:0), sum=others.reduce((a,c)=>a+c.w,0);
  if(!others.length){if(keep)keep.w=100;return}
  others.forEach(o=>o.w=sum>0?Math.round(o.w*rest/sum):Math.round(rest/others.length));
  const diff=100-l.reduce((a,c)=>a+c.w,0), big=others.slice().sort((a,b)=>b.w-a.w)[0];
  big.w=Math.max(0,big.w+diff);
}

// ===== PASTE YOUR FIREBASE SETTINGS HERE =====
const CFG={apiKey:"AIzaSyD9DTehb3lNWGcr6MbpsfOQ3I55hpwP7aI",authDomain:"dashboard-467f5.firebaseapp.com",projectId:"dashboard-467f5",appId:"1:1069570650154:web:65756f3f661d8c04a01353"};
// =============================================
let ref=null;
function save(){
  data.updated=Date.now();
  LS.setItem('pri_data',JSON.stringify(data));
  status='wait';dots();clearTimeout(timer);timer=setTimeout(push,500);
}
async function push(){
  if(!ref)return;
  try{await ref.set({json:JSON.stringify(data),updated:data.updated});status='ok'}catch(e){status='err'}
  dots();
}
function dots(){
  const d=$('.dot');if(!d)return;
  d.className='dot '+(status==='ok'?'ok':status==='err'?'err':'');
  d.title={ok:'Saved',wait:'Saving…',err:'Not saved — check connection'}[status]||'';
}
function gate(t,m,btn){
  $('#md').innerHTML=`<div class="modal" style="background:var(--bg)"><div class="box" style="text-align:center;align-items:center"><b style="font-size:18px">${t}</b><p>${m}</p>${btn?'<button class="t" onclick="signin()">Sign in with Google</button>':''}</div></div>`;
}
function signin(){firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert(e.message))}
function init(){
  if(CFG.apiKey==='PASTE'){gate('Setup needed','Paste your Firebase settings into the CFG block at the top of the script.');return}
  firebase.initializeApp(CFG);
  const fdb=firebase.firestore();
  fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){ref=null;gate('Priorities','Sign in to continue.',true);return}
    $('#md').innerHTML='';
    ref=fdb.collection('users').doc(u.uid);
    ref.onSnapshot(s=>{
      if(!s.exists){push();return}
      const d=s.data();
      if(d.updated>data.updated){data=JSON.parse(d.json);LS.setItem('pri_data',d.json);render();status='ok';dots()}
      else if(d.updated<data.updated)push();
      else{status='ok';dots()}
    });
  });
}

function render(){
  const c=cur();
  $('#hd').innerHTML=`<h1>${ten?`<button class="back" onclick="ten=false;edit=false;render()">‹</button>What 10/10 looks like`:desc?`<button class="back" onclick="desc=false;render()">‹</button>Description`:c?`<button class="back" onclick="${focus?'path=[];render()':'up()'}">‹</button>${focus?'Focus':esc(c.name)}`:focus?'Focus':'Priorities'}</h1>
    <span class="ov"><b>${fmt(c?score(c):overall())}</b> / 10</span>
    ${!ten&&!desc&&!(focus&&!c)?`<button class="t ic" onclick="desc=true;edit=false;render()" title="Description">${DESC}</button>${c?`<button class="t ic" onclick="ten=true;edit=false;render()" title="What 10/10 looks like">${STAR}</button>`:''}`:''}
    ${!ten&&!desc?`<button class="t ic ${focus?'on':''}" onclick="toggleFocus()" title="Focus">${FOCUS}</button>`:''}
    ${desc||focus?'':`<button class="t ic ${edit?'on':''}" onclick="edit=!edit;render()" title="${edit?'Done':'Edit'}">${edit?CHECK:PEN}</button>`}
    <span class="dot" onclick="settings()"></span>`;
  dots();
  const m=$('#mn');
  if(ten){gallery(m,c);return}
  if(desc){descPage(m,c);return}
  if(focus){if(c)focusCard(m,c);else feed(m);return}
  if(edit){
    const l=list(), t=l.reduce((a,c)=>a+c.w,0);
    m.innerHTML=`<div class="list"><div class="row h"><span>Name</span><span>%</span><span>Score</span><span></span><span></span></div>`+
      l.map((x,i)=>`<div class="row"><input value="${esc(x.name)}" onchange="upd(${i},'name',this.value)">
      <input type="number" min="0" max="100" value="${x.w}" onchange="upd(${i},'w',this.value)">
      <input type="number" min="0" max="10" step="0.5" value="${fmt(score(x))}" onchange="upd(${i},'s',this.value)">
      <button class="x" onclick="down('${x.id}')" title="Open">›</button><button class="x" onclick="del(${i})">×</button></div>`).join('')+
      `<button class="t add" onclick="add()">+ Add ${path.length?'part':'priority'}</button><div class="tot">Total ${t}%</div></div>`;
    return;
  }
  const W=m.clientWidth,Hh=m.clientHeight, l=list().filter(x=>x.w>0);
  if(!l.length){m.innerHTML='<p style="color:var(--mu);padding:20px">Nothing here yet. Tap Edit to add something.</p>';return}
  m.innerHTML=tm(l,W,Hh).map(r=>{
    const x=r.c, sc=score(x), a=Math.sqrt(r.w*r.h), fs=Math.max(11,Math.min(a/7,22)), pf=Math.max(14,Math.min(a/3.2,64));
    return `<div class="tile" data-id="${x.id}" onpointerdown="pd(event,'${x.id}')" oncontextmenu="return false" style="left:${r.x/W*100}%;top:${r.y/Hh*100}%;width:${r.w/W*100}%;height:${r.h/Hh*100}%">
      <div style="background:hsl(${sc*12},38%,${24+sc}%)" >
      <span class="n" style="font-size:${fs}px">${esc(x.name)}</span>
      <span class="s" style="font-size:13px">${fmt(sc)}/10</span></div></div>`}).join('');
}
function tm(items,W,H){ // treemap: area = weight
  const T=items.reduce((a,b)=>a+b.w,0), k=W*H/T, out=[];
  let rest=[...items].sort((a,b)=>b.w-a.w), x=0,y=0,w=W,h=H;
  const worst=(r,s)=>{const a=r.reduce((p,c)=>p+c.w*k,0),mx=Math.max(...r.map(c=>c.w*k)),mn=Math.min(...r.map(c=>c.w*k));return Math.max(s*s*mx/(a*a),a*a/(s*s*mn))};
  while(rest.length){
    const s=Math.min(w,h);let r=[rest[0]],i=1;
    while(i<rest.length&&worst([...r,rest[i]],s)<=worst(r,s))r.push(rest[i++]);
    rest=rest.slice(r.length);
    const a=r.reduce((p,c)=>p+c.w*k,0);
    if(w>=h){const cw=a/h;let cy=y;r.forEach(c=>{const ch=c.w*k/cw;out.push({c,x,y:cy,w:cw,h:ch});cy+=ch});x+=cw;w-=cw}
    else{const rh=a/w;let cx=x;r.forEach(c=>{const cw=c.w*k/rh;out.push({c,x:cx,y,w:cw,h:rh});cx+=cw});y+=rh;h-=rh}
  }
  return out;
}
// ---- "What 10/10 looks like" image page (images live in their own documents)
const STAR='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
const imgCache={}, tried=new Set();
function gallery(m,c){
  const ids=c.imgs||[], need=ids.filter(i=>!imgCache[i]&&!tried.has(i));
  if(need.length&&ref){
    need.forEach(i=>tried.add(i));
    Promise.all(need.map(i=>ref.collection('images').doc(i).get().then(d=>{if(d.exists)imgCache[i]=d.data().d}).catch(()=>{}))).then(()=>{if(ten)render()});
  }
  m.innerHTML=`<div class="gal">${edit||!ids.length?`<button class="t add" onclick="$('#up').click()">+ Add images</button><input id="up" type="file" accept="image/*" multiple hidden onchange="addImgs(this.files)">`:''}${ids.length?`<div class="mas">${ids.map(i=>`<div class="im">${imgCache[i]?`<img src="${imgCache[i]}" ${edit?'':`style="cursor:zoom-in" onclick="zoom('${i}')"`}>`:'<div class="ph"></div>'}${edit?`<button class="x rm" onclick="rmImg('${i}')">×</button>`:''}</div>`).join('')}</div>`:`<p style="color:var(--mu);padding:12px 0">Add images that show what a 10/10 looks like.</p>`}</div>`;
}
function shrink(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);let q=.8,d;do{d=cv.toDataURL('image/jpeg',q);q-=.1}while(d.length>900000&&q>.3);res(d)};im.onerror=()=>res(null);im.src=u})}
async function addImgs(files){
  const c=cur();if(!c||!ref)return;
  for(const f of [...files]){
    const d=await shrink(f);if(!d)continue;
    const id=uid()+uid();
    try{await ref.collection('images').doc(id).set({d})}catch(e){alert('Could not save the image. Check that your Firestore rules are updated.');return}
    imgCache[id]=d;(c.imgs=c.imgs||[]).push(id);save();render();
  }
}
function rmImg(id){
  const c=cur();c.imgs=(c.imgs||[]).filter(i=>i!==id);delete imgCache[id];
  if(ref)ref.collection('images').doc(id).delete().catch(()=>{});
  save();render();
}
function purge(n){
  (n.imgs||[]).forEach(i=>{delete imgCache[i];if(ref)ref.collection('images').doc(i).delete().catch(()=>{})});
  (n.subs||[]).forEach(purge);
}
let zl=[],zi=0;
function zoom(id){
  zl=(cur().imgs||[]).filter(k=>imgCache[k]);zi=zl.indexOf(id);
  const z=document.createElement('div');z.id='zm';z.className='modal';
  z.style.cssText='padding:0;background:#000e;cursor:zoom-out;z-index:9';
  z.onclick=()=>z.remove();
  z.innerHTML=`<img id="zimg" src="${imgCache[id]}" style="max-width:100vw;max-height:100vh;object-fit:contain">`;
  document.body.appendChild(z);
}
function zstep(d){
  if(zl.length<2)return;
  zi=(zi+d+zl.length)%zl.length;
  $('#zimg').src=imgCache[zl[zi]];
}
addEventListener('keydown',e=>{
  const z=$('#zm');if(!z)return;
  if(e.key==='Escape')z.remove();
  else if(e.key==='ArrowRight')zstep(1);
  else if(e.key==='ArrowLeft')zstep(-1);
});
// ---- hold a tile for 3 seconds, then drag it onto another tile to move it inside
let dg=null;
function pd(e,id){
  if(e.button>0||edit||dg)return;
  e.preventDefault();
  const t=e.currentTarget;
  dg={id,el:t,x0:e.clientX,y0:e.clientY,lx:e.clientX,ly:e.clientY,on:false,moved:false,tgt:null,ghost:null};
  t.classList.add('hold');
  dg.timer=setTimeout(()=>{
    if(!dg)return;
    dg.on=true;t.classList.remove('hold');t.classList.add('drag');
    const g=document.createElement('div');g.className='ghost';
    g.style.background=t.firstElementChild.style.background;
    g.textContent=t.querySelector('.n').textContent;
    g.style.left=dg.lx+'px';g.style.top=dg.ly+'px';
    document.body.appendChild(g);dg.ghost=g;
    if(navigator.vibrate)navigator.vibrate(30);
  },3000);
  addEventListener('pointermove',pm);addEventListener('pointerup',pu);addEventListener('pointercancel',pc);
}
function pm(e){
  if(!dg)return;
  dg.lx=e.clientX;dg.ly=e.clientY;
  if(!dg.on){
    if(Math.hypot(e.clientX-dg.x0,e.clientY-dg.y0)>12){clearTimeout(dg.timer);dg.el.classList.remove('hold');dg.moved=true}
    return;
  }
  dg.ghost.style.left=e.clientX+'px';dg.ghost.style.top=e.clientY+'px';
  const el=document.elementsFromPoint(e.clientX,e.clientY).map(n=>n.closest('.tile')).find(t=>t&&t!==dg.el)||null;
  if(dg.tgt!==el){if(dg.tgt)dg.tgt.classList.remove('tgt');dg.tgt=el;if(el)el.classList.add('tgt')}
}
function endDrag(){
  clearTimeout(dg.timer);
  dg.el.classList.remove('hold','drag');
  if(dg.tgt)dg.tgt.classList.remove('tgt');
  if(dg.ghost)dg.ghost.remove();
  removeEventListener('pointermove',pm);removeEventListener('pointerup',pu);removeEventListener('pointercancel',pc);
  const d=dg;dg=null;return d;
}
function pu(){
  if(!dg)return;
  const d=endDrag();
  if(d.on){if(d.tgt)moveInto(d.id,d.tgt.dataset.id);else render()}
  else if(!d.moved)down(d.id);
}
function pc(){if(dg)endDrag()}
function moveInto(id,tid){
  const l=list(),i=l.findIndex(x=>x.id===id),j=l.findIndex(x=>x.id===tid);
  if(i<0||j<0||i===j){render();return}
  const n=l[i],t=l[j];
  l.splice(i,1);balance(l,null);
  n.w=Math.round(100/(t.subs.length+1));
  t.subs.push(n);balance(t.subs,n);
  save();render();
}
// ---- description page (edits save as you type)
const PEN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const CHECK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const DESC='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>';
function descPage(m,c){
  m.innerHTML=`<div class="gal"><textarea class="ds" placeholder="Enter description" oninput="(cur()||data).desc=this.value;save()">\n${esc((c||data).desc||'')}</textarea></div>`;
}
// ---- Focus mode: every deepest item ranked by how many points it could add to your overall score
const FOCUS='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>';
function ranked(){
  const out=[];
  const go=(l,f,chain)=>{
    const T=l.reduce((a,c)=>a+c.w,0);if(!T)return;
    l.forEach(c=>{
      if(c.w<=0)return;
      const g=f*c.w/T,ch=[...chain,c];
      if(c.subs.length)go(c.subs,g,ch);else out.push({n:c,ch,gain:g*(10-c.s)});
    });
  };
  go(data.items,1,[]);
  return out.filter(x=>x.gain>0.0005).sort((a,b)=>b.gain-a.gain);
}
function feed(m){
  const r=ranked();
  if(!r.length){m.innerHTML='<p style="color:var(--mu);padding:20px">Everything is at 10.</p>';return}
  m.innerHTML=`<div class="gal">${r.map((x,i)=>`<div class="fcard ${i?'':'top'}" style="background:hsl(${x.n.s*12},38%,${24+x.n.s}%)" onclick="openChain('${x.ch.map(c=>c.id).join(',')}')">
    ${x.ch.length>1?`<span class="fc-ch">${x.ch.slice(0,-1).map(c=>esc(c.name)).join(' › ')}</span>`:''}
    <span class="fc-n">${esc(x.n.name)}</span><span class="fc-s">${fmt(x.n.s)}/10</span></div>`).join('')}</div>`;
}
function openChain(s){path=s.split(',');render()}
function focusCard(m,c){
  let l=data.items;const names=[];
  for(const id of path){const n=l.find(i=>i.id===id);if(!n)break;names.push(n.name);l=n.subs}
  const sc=score(c);
  m.innerHTML=`<div class="gal"><div class="fcd" style="background:hsl(${sc*12},38%,${24+sc}%)">
    ${names.length>1?`<span class="fc-ch">${names.slice(0,-1).map(esc).join(' › ')}</span>`:''}
    <span class="fc-n">${esc(c.name)}</span>
    <div class="stp"><button class="t" onclick="fstep(-.5)">−</button><b>${fmt(sc)}</b><span class="fc-s">/10</span><button class="t" onclick="fstep(.5)">+</button></div>
    ${c.desc?`<p class="fdesc">${esc(c.desc)}</p>`:''}</div></div>`;
}
function fstep(d){
  const c=cur(),t=Math.max(0,Math.min(10,score(c)+d));
  if(c.subs.length)setScore(c,t);else c.s=t;
  save();render();
}
function toggleFocus(){focus=!focus;LS.setItem('pri_focus',focus?'1':'0');path=[];edit=false;render()}
function down(id){path=[...path,id];edit=false;render()}
function up(){path=path.slice(0,-1);edit=false;render()}
function upd(i,f,v){
  const l=list(),x=l[i];
  if(f==='name')x.name=v||'Untitled';
  else if(f==='s'){const t=Math.max(0,Math.min(10,+v||0));if(x.subs.length)setScore(x,t);else x.s=t}
  else{x.w=Math.max(0,Math.min(100,Math.round(+v||0)));balance(l,x)}
  save();render();
}
// set a parent's score by shifting every part inside it equally (stops at 0 and 10)
function setScore(n,t){
  const lv=[];
  (function walk(x,f){
    if(!x.subs.length){lv.push({x,f});return}
    const T=x.subs.reduce((a,c)=>a+c.w,0);if(!T)return;
    x.subs.forEach(c=>walk(c,f*c.w/T));
  })(n,1);
  for(let k=0;k<12;k++){
    const d=t-lv.reduce((a,l)=>a+l.f*l.x.s,0);
    if(Math.abs(d)<1e-6)break;
    const free=lv.filter(l=>l.f>0&&(d>0?l.x.s<10:l.x.s>0)), fs=free.reduce((a,l)=>a+l.f,0);
    if(!fs)break;
    free.forEach(l=>l.x.s=Math.max(0,Math.min(10,l.x.s+d/fs)));
  }
}
function add(){const l=list(),p=cur(),n=mk('New',Math.round(100/(l.length+1)));if(p)n.s=score(p);l.push(n);balance(l,n);save();render()}
function del(i){const l=list(),p=cur();if(p&&l.length===1)p.s=score(p);purge(l[i]);l.splice(i,1);if(l.length)balance(l,null);save();render()}

function settings(){
  const u=firebase.auth().currentUser;
  $('#md').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="box">
  <b style="font-size:15px">Account</b>
  <p>Signed in as ${u?esc(u.email):''}. Everything is saved to your account automatically.</p>
  <div class="btns"><button class="t" onclick="dl()">Download backup</button><button class="t" onclick="$('#im').click()">Restore backup</button><button class="t" onclick="firebase.auth().signOut()">Sign out</button></div>
  <input id="im" type="file" accept=".json" hidden onchange="imp(this.files[0])">
  </div></div>`;
}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='priorities-backup.json';a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();path=[];ten=false;desc=false;$('#md').innerHTML='';render()}catch(e){alert('That file is not a valid backup.')}};r.readAsText(f)}

addEventListener('resize',()=>{if(!edit&&!desc)render()});
render();init();
</script>
</body>
