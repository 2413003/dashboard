<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#101114;--fg:#eef0f4;--mu:#8a8f9c;--ln:#23252b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Sora',system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:16px 20px}
header h1{font-size:15px;font-weight:600;flex:1;display:flex;align-items:center;gap:10px}
.back{background:none;border:0;color:var(--mu);font:inherit;font-size:20px;cursor:pointer;padding:0 4px}
.ov{font-size:13px;color:var(--mu)} .ov b{color:var(--fg);font-size:18px;font-weight:700}
button.t{background:none;border:1px solid var(--ln);color:var(--fg);font:inherit;font-size:12px;padding:7px 13px;border-radius:99px;cursor:pointer}
button.t:hover,button.t.on{background:var(--fg);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;background:#d9a441;cursor:pointer}
.dot.ok{background:#5fb87a}.dot.err{background:#d9534f}
main{flex:1;position:relative;margin:0 20px 20px;min-height:0}
.tile{position:absolute;padding:3px}
.tile>div{height:100%;border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden;transition:filter .15s}
.tile>div:hover{filter:brightness(1.18)}
.tile .n{font-weight:600;line-height:1.15}.tile .p{font-weight:700;line-height:1}.tile .s{opacity:.75;font-weight:400}
.list{max-width:640px;margin:0 auto;overflow:auto;height:100%;padding:3px 6px}
.row{display:grid;grid-template-columns:1fr 64px 64px 28px 28px;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);align-items:center}
.row.h{color:var(--mu);font-size:11px}
input{background:#181a1f;border:1px solid var(--ln);color:var(--fg);font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;width:100%}
input:disabled{opacity:.5}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}
.add{margin:16px 0}
.tot{color:var(--mu);font-size:12px;margin-top:6px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#16181d;border:1px solid var(--ln);border-radius:14px;padding:24px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.6}
.box a{color:var(--fg)}.box p{color:var(--mu)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.gal{overflow:auto;height:100%;padding:3px 6px}
.mas{columns:220px;column-gap:10px}
.im{break-inside:avoid;margin-bottom:10px;position:relative}
.im img{width:100%;display:block;border-radius:10px}
.ph{height:140px;background:#181a1f;border-radius:10px}
.rm{position:absolute;top:6px;right:6px;background:#000a;color:#fff;width:26px;height:26px;border-radius:50%;font-size:16px;line-height:1;padding:0}
.ic{padding:7px 9px;display:flex;align-items:center}

.vfs{width:100%;margin-top:6px;padding:6px 10px;display:flex;justify-content:center;align-items:center;gap:6px}
.pg{max-width:640px;margin:0 auto}
.pg .im{margin-bottom:12px}
.tx{display:block;width:100%;background:#181a1f;border:1px solid var(--ln);border-radius:10px;padding:14px;color:var(--fg);font:inherit;font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
textarea.tx{min-height:96px;resize:none;overflow:hidden;padding-right:40px}
.vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vd{display:block;width:100%;border-radius:10px;background:#000}
.lk{display:flex;flex-direction:column;gap:4px;padding:14px;background:#181a1f;border:1px solid var(--ln);border-radius:10px;color:var(--fg);text-decoration:none;font-size:13px}
.lk small{color:var(--mu);word-break:break-all}
.pc{background:#181a1f;border:1px solid var(--ln);border-radius:10px;overflow:hidden;cursor:pointer}
.pc:hover{border-color:var(--mu)}
.pc img,.pc .ph{border-radius:0}
.pb{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pb b{font-size:14px;font-weight:600}
.pb p{font-size:13px;color:var(--mu);line-height:1.5;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pb span{font-size:11px;color:var(--mu)}

.tile{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile.hold>div{transform:scale(.95);transition:transform 3s linear}
.tile.drag{opacity:.35}
.tile.tgt>div{outline:3px solid #fff;outline-offset:-3px;filter:brightness(1.25)}
.ghost{position:fixed;z-index:20;transform:translate(-50%,-50%) scale(1.04);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px #000a;pointer-events:none;max-width:60vw}

.ds{display:block;width:100%;height:calc(100% - 6px);resize:none;background:#181a1f;border:1px solid var(--ln);color:var(--fg);font:inherit;font-size:15px;line-height:1.7;padding:16px;border-radius:12px}

.fcard{border-radius:12px;padding:18px;margin-bottom:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.fcard:hover{filter:brightness(1.12)}
.fcard.top{padding:30px 20px}
.fc-ch{font-size:12px;opacity:.7}
.fc-n{font-weight:600;font-size:18px;line-height:1.2}
.fcard.top .fc-n{font-size:26px}
.fc-s{font-size:13px;opacity:.75}
.fcd{border-radius:14px;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.fcd .fc-n{font-size:30px}
.stp{display:flex;align-items:center;gap:14px}
.stp b{font-size:34px;min-width:2.4ch;text-align:center}
.stp .t{font-size:20px;width:40px;height:40px;justify-content:center}
.fdesc{white-space:pre-wrap;opacity:.85;line-height:1.7;font-size:14px}

input[type=date]{color-scheme:dark}
.home{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;max-width:980px;margin:0 auto;height:100%;overflow:auto;padding:3px 6px 20px;align-content:start;align-items:start}
.home>.rail{position:sticky;top:0}
@media(max-width:760px){.home{grid-template-columns:1fr}.home>.rail{position:static}}
.card{background:#181a1f;border:1px solid var(--ln);border-radius:12px;padding:18px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.av{width:56px;height:56px;border-radius:50%;background:#23252b;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.pr{display:flex;flex-direction:column;gap:14px}
.pr>b{font-size:16px;overflow-wrap:anywhere}
.st b{display:block;font-size:15px;margin-top:2px}
.chh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.big{display:block;font-size:34px;font-weight:700;line-height:1.1;margin:4px 0}
.dl{font-size:13px;color:var(--mu)}
.pos{color:#5fb87a}.neg{color:#d9534f}
.ax{fill:var(--mu);font-size:11px;font-family:inherit}
.lg{display:flex;gap:16px;font-size:11px;color:var(--mu);margin-top:6px}
.lg i{display:inline-block;width:14px;border-top:2px solid #5fb87a;margin-right:6px;vertical-align:middle}
.lg i.d{border-top:2px dashed var(--mu)}
.fe{position:relative;display:flex;flex-direction:column;gap:4px}
.fv{font-size:22px;font-weight:600}
.fn{font-size:13px;color:var(--mu);white-space:pre-wrap;margin-top:4px}
.fx{position:absolute;top:10px;right:12px}
.bk{position:fixed;inset:0;z-index:10}
.apps{position:fixed;top:58px;right:16px;width:268px;background:#16181d;border:1px solid var(--ln);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;box-shadow:0 10px 30px #000a;z-index:11}
.app{background:none;border:0;color:var(--fg);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:10px;cursor:pointer}
.app:hover{background:#23252b}
.app i{width:42px;height:42px;border-radius:12px;background:#23252b;display:flex;align-items:center;justify-content:center}
.app.on i{background:var(--fg);color:var(--bg)}
</style>
</head>
<body>
<header id="hd"></header>
<main id="mn"></main>
<div id="md"></div>
<script>
const $=s=>document.querySelector(s), LS=localStorage, FILE='priorities.json', GH='https://api.github.com';
const uid=()=>Math.random().toString(36).slice(2,9);
const mk=(n,w)=>({id:uid(),name:n,w,s:5,subs:[]});
let data;
try{data=JSON.parse(LS.getItem('pri_data'))}catch(e){}
if(!data)data={updated:0,items:['Health','Wealth','Relationships','Work','Growth'].map(n=>mk(n,20))};
let path=[], ten=false, prof=null, desc=false, edit=false, focus=LS.getItem('pri_focus')==='1', timer, status='wait';
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

const cur=()=>{let n=null,l=data.items;for(const id of path){n=l.find(i=>i.id===id);if(!n)return null;l=n.subs}return n};
const list=()=>path.length?cur().subs:data.items;
const score=i=>i.subs.length?i.subs.reduce((a,c)=>a+c.w*score(c),0)/(i.subs.reduce((a,c)=>a+c.w,0)||1):i.s;
const overall=()=>data.items.reduce((a,c)=>a+c.w*score(c),0)/(data.items.reduce((a,c)=>a+c.w,0)||1);
const fmt=n=>(Math.round(n*10)/10).toString();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// keep every list totalling exactly 100
function balance(l,keep,target){
  const others=l.filter(x=>x!==keep), rest=100-(keep?keep.w:0), sum=others.reduce((a,c)=>a+c.w,0);
  if(!others.length){if(keep)keep.w=100;return}
  others.forEach(o=>o.w=sum>0?Math.round(o.w*rest/sum):Math.round(rest/others.length));
  const diff=100-l.reduce((a,c)=>a+c.w,0), big=others.slice().sort((a,b)=>b.w-a.w)[0];
  big.w=Math.max(0,big.w+diff);
}

// ===== PASTE YOUR FIREBASE SETTINGS HERE =====
const CFG={apiKey:"AIzaSyD9DTehb3lNWGcr6MbpsfOQ3I55hpwP7aI",authDomain:"dashboard-467f5.firebaseapp.com",projectId:"dashboard-467f5",appId:"1:1069570650154:web:65756f3f661d8c04a01353"};
// =============================================
let ref=null;
function save(){
  data.updated=Date.now();
  LS.setItem('pri_data',JSON.stringify(data));
  status='wait';dots();clearTimeout(timer);timer=setTimeout(push,500);
}
async function push(){
  if(!ref)return;
  try{await ref.set({json:JSON.stringify(data),updated:data.updated});status='ok'}catch(e){status='err'}
  dots();
}
function dots(){
  const d=$('.dot');if(!d)return;
  d.className='dot '+(status==='ok'?'ok':status==='err'?'err':'');
  d.title={ok:'Saved',wait:'Saving…',err:'Not saved — check connection'}[status]||'';
}
function gate(t,m,btn){
  $('#md').innerHTML=`<div class="modal" style="background:var(--bg)"><div class="box" style="text-align:center;align-items:center"><b style="font-size:18px">${t}</b><p>${m}</p>${btn?'<button class="t" onclick="signin()">Sign in with Google</button>':''}</div></div>`;
}
function signin(){firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert(e.message))}
function init(){
  if(CFG.apiKey==='PASTE'){gate('Setup needed','Paste your Firebase settings into the CFG block at the top of the script.');return}
  firebase.initializeApp(CFG);
  const fdb=firebase.firestore();
  fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){ref=null;gate('Priorities','Sign in to continue.',true);return}
    $('#md').innerHTML='';
    ref=fdb.collection('users').doc(u.uid);render();
    ref.onSnapshot(s=>{
      if(!s.exists){push();return}
      const d=s.data();
      if(d.updated>data.updated){data=JSON.parse(d.json);LS.setItem('pri_data',d.json);render();status='ok';dots()}
      else if(d.updated<data.updated)push();
      else{status='ok';dots()}
    });
  });
}

function render(){
  if(app==='home'){home();return}
  const c=cur();
  if(ten&&prof&&!pf())prof=null;
  $('#hd').innerHTML=`<h1>${ten?`<button class="back" onclick="${prof?'prof=null':'ten=false;edit=false'};render()">‹</button><span id="ttl">${prof?esc((pf().name||'').trim()||'Untitled'):'What 10/10 looks like'}</span>`:desc?`<button class="back" onclick="desc=false;render()">‹</button>Description`:c?`<button class="back" onclick="${focus?'path=[];render()':'up()'}">‹</button>${focus?'Focus':esc(c.name)}`:focus?'Focus':'Priorities'}</h1>
    <span class="ov"><b>${fmt(c?score(c):overall())}</b> / 10</span>
    ${!ten&&!desc&&!(focus&&!c)?`<button class="t ic" onclick="desc=true;edit=false;render()" title="Description">${DESC}</button>${c?`<button class="t ic" onclick="ten=true;prof=null;edit=false;render()" title="What 10/10 looks like">${STAR}</button>`:''}`:''}
    ${!ten&&!desc?`<button class="t ic ${focus?'on':''}" onclick="toggleFocus()" title="Focus">${FOCUS}</button>`:''}
    ${desc||focus?'':`<button class="t ic ${edit?'on':''}" onclick="edit=!edit;render()" title="${edit?'Done':'Edit'}">${edit?CHECK:PEN}</button>`}
    ${GRIDB}<span class="dot" onclick="settings()"></span>`;
  dots();
  const m=$('#mn');
  if(ten){gallery(m,c);return}
  if(desc){descPage(m,c);return}
  if(focus){if(c)focusCard(m,c);else feed(m);return}
  if(edit){
    const l=list(), t=l.reduce((a,c)=>a+c.w,0);
    m.innerHTML=`<div class="list"><div class="row h"><span>Name</span><span>%</span><span>Score</span><span></span><span></span></div>`+
      l.map((x,i)=>`<div class="row"><input value="${esc(x.name)}" onchange="upd(${i},'name',this.value)">
      <input type="number" min="0" max="100" value="${x.w}" onchange="upd(${i},'w',this.value)">
      <input type="number" min="0" max="10" step="0.5" value="${fmt(score(x))}" onchange="upd(${i},'s',this.value)">
      <button class="x" onclick="down('${x.id}')" title="Open">›</button><button class="x" onclick="del(${i})">×</button></div>`).join('')+
      `<button class="t add" onclick="add()">+ Add ${path.length?'part':'priority'}</button><div class="tot">Total ${t}%</div></div>`;
    return;
  }
  const W=m.clientWidth,Hh=m.clientHeight, l=list().filter(x=>x.w>0);
  if(!l.length){m.innerHTML='<p style="color:var(--mu);padding:20px">Nothing here yet. Tap Edit to add something.</p>';return}
  m.innerHTML=tm(l,W,Hh).map(r=>{
    const x=r.c, sc=score(x), a=Math.sqrt(r.w*r.h), fs=Math.max(11,Math.min(a/7,22)), pf=Math.max(14,Math.min(a/3.2,64));
    return `<div class="tile" data-id="${x.id}" onpointerdown="pd(event,'${x.id}')" oncontextmenu="return false" style="left:${r.x/W*100}%;top:${r.y/Hh*100}%;width:${r.w/W*100}%;height:${r.h/Hh*100}%">
      <div style="background:hsl(${sc*12},38%,${24+sc}%)" >
      <span class="n" style="font-size:${fs}px">${esc(x.name)}</span>
      <span class="s" style="font-size:13px">${fmt(sc)}/10</span></div></div>`}).join('');
}
function tm(items,W,H){ // treemap: area = weight
  const T=items.reduce((a,b)=>a+b.w,0), k=W*H/T, out=[];
  let rest=[...items].sort((a,b)=>b.w-a.w), x=0,y=0,w=W,h=H;
  const worst=(r,s)=>{const a=r.reduce((p,c)=>p+c.w*k,0),mx=Math.max(...r.map(c=>c.w*k)),mn=Math.min(...r.map(c=>c.w*k));return Math.max(s*s*mx/(a*a),a*a/(s*s*mn))};
  while(rest.length){
    const s=Math.min(w,h);let r=[rest[0]],i=1;
    while(i<rest.length&&worst([...r,rest[i]],s)<=worst(r,s))r.push(rest[i++]);
    rest=rest.slice(r.length);
    const a=r.reduce((p,c)=>p+c.w*k,0);
    if(w>=h){const cw=a/h;let cy=y;r.forEach(c=>{const ch=c.w*k/cw;out.push({c,x,y:cy,w:cw,h:ch});cy+=ch});x+=cw;w-=cw}
    else{const rh=a/w;let cx=x;r.forEach(c=>{const cw=c.w*k/rh;out.push({c,x:cx,y,w:cw,h:rh});cx+=cw});y+=rh;h-=rh}
  }
  return out;
}
// ---- "What 10/10 looks like" page: images, text, videos and profiles (image data lives in its own documents)
const STAR='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
const imgCache={}, tried=new Set();
// examples can be: image, text, video, or a profile that groups several of those
function exs(c){if(c.imgs){c.ex=(c.ex||[]).concat(c.imgs.map(id=>({id,t:'img'})));delete c.imgs}return c.ex=c.ex||[]}
function pf(){const c=cur();return c&&prof?exs(c).find(e=>e.id===prof)||null:null}
function box(){const c=cur();if(!c)return null;const p=pf();return p?p.blocks:exs(c)}
function loadImgs(ids){
  const need=ids.filter(i=>!imgCache[i]&&!tried.has(i));
  if(!need.length||!ref)return;
  need.forEach(i=>tried.add(i));
  Promise.all(need.map(i=>ref.collection('images').doc(i).get().then(d=>{if(d.exists)imgCache[i]=d.data().d}).catch(()=>{}))).then(()=>{
    const a=document.activeElement;
    if(ten&&!(a&&a.matches('textarea,input')))render();
  });
}
function normUrl(u){
  u=(u||'').trim();if(!u)return null;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;
  return /^https?:\/\/[^\s\/]+\.[^\s]+/i.test(u)?u:null;
}
function vidEmbed(u){
  let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  if(m)return{k:'f',src:'https://www.youtube-nocookie.com/embed/'+m[1]};
  m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m)return{k:'f',src:'https://player.vimeo.com/video/'+m[1]};
  if(/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(u))return{k:'v',src:u};
  return null;
}
function vidHTML(e){
  const v=vidEmbed(e.url||'');
  if(!v){let h=e.url;try{h=new URL(e.url).hostname.replace(/^www\./,'')}catch(x){}
    return `<a class="lk" href="${esc(e.url||'')}" target="_blank" rel="noopener"><b>${esc(h)}</b><small>${esc(e.url||'')}</small></a>`}
  if(v.k==='f')return `<div class="vid"><iframe src="${v.src}" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
  return `<video class="vd" src="${esc(v.src)}" controls preload="metadata" playsinline></video>`;
}
function profCard(e){
  const im=e.blocks.find(b=>b.t==='img'), tx=e.blocks.find(b=>b.t==='text'&&(b.text||'').trim()), n=e.blocks.length;
  return `<div class="pc" onclick="openProf('${e.id}')">${im?(imgCache[im.id]?`<img src="${imgCache[im.id]}">`:'<div class="ph"></div>'):''}
    <div class="pb"><b>${esc((e.name||'').trim()||'Untitled')}</b>${tx?`<p>${esc(tx.text)}</p>`:''}<span>${n?n+(n>1?' items':' item'):'Empty'}</span></div></div>`;
}
function exHTML(e){
  let b='';
  if(e.t==='img')b=imgCache[e.id]?`<img src="${imgCache[e.id]}" ${edit?'':`style="cursor:zoom-in" onclick="zoom('${e.id}')"`}>`:'<div class="ph"></div>';
  else if(e.t==='text')b=edit?`<textarea class="tx" placeholder="Write something…" oninput="setTx('${e.id}',this.value);grow(this)">\n${esc(e.text||'')}</textarea>`:`<div class="tx">${esc(e.text||'')}</div>`;
  else if(e.t==='vid')b=vidHTML(e)+(vidEmbed(e.url||'')?`<button class="t vfs" onclick="fsVid('${e.id}')">${EXP} Fullscreen</button>`:'');
  else if(e.t==='prof')b=profCard(e);

      <div class="st"><span class="fc-s">AUM</span><b>${kf(last)}</b></div></div></div>
    <div class="col"><div class="card"><div class="chh"><div><span class="fc-s">Assets under management</span><b class="big" id="hv">${gbp(last)}</b><div class="dl" id="hl">${lab}</div></div><div class="btns">${pills}</div></div>
      <div id="cv"></div>${pv.length?'<div class="lg"><span><i></i>This period</span><span><i class="d"></i>Previous period</span></div>':''}</div>
      ${feed}</div></div>`;
  const W=$('#cv').clientWidth||600,H=230,T=16,B=24,h=H-T-B,X=t=>(t-s)/Math.max(e-s,1)*W,Y=v=>T+h-(v-lo)/(hi-lo)*h,
    P=l=>'M'+l.map(p=>X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)).join('L');
  cx={s,e,W,Y,cur:gbp(last),lab};
  $('#cv').innerHTML=`<svg width="${W}" height="${H}" style="display:block;touch-action:pan-y" onpointermove="hov(event)" onpointerleave="hov()">
    ${[0,.5,1].map(f=>{const y=T+h*f;return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--ln)"/><text x="${W}" y="${y-5}" text-anchor="end" class="ax">${kf(hi-(hi-lo)*f)}</text>`}).join('')}
    ${pv.length?`<path d="${P(pv)}" fill="none" stroke="var(--mu)" stroke-width="1.5" stroke-dasharray="4 4"/>`:''}
    <path d="${P(cur)} L${X(e)} ${T+h} L${X(cur[0].t)} ${T+h}Z" fill="#5fb87a" opacity=".12"/>
    <path d="${P(cur)}" fill="none" stroke="#5fb87a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(e)}" cy="${Y(last)}" r="4.5" fill="#5fb87a"/>
    <line id="cl" y1="${T}" y2="${T+h}" stroke="var(--mu)" style="display:none"/><circle id="cd" r="5" fill="#101114" stroke="#5fb87a" stroke-width="2" style="display:none"/>
    <text x="0" y="${H-6}" class="ax">${fd(s,R>2.5e10)}</text><text x="${W}" y="${H-6}" text-anchor="end" class="ax">${fd(e)===fd(Date.now())?'Today':fd(e)}</text></svg>`;
}
// scrub the chart: the big number and date follow your finger or cursor
function hov(ev){
  if(!cx)return;
  const l=$('#cl'),d=$('#cd'),hv=$('#hv'),hl=$('#hl');if(!l)return;
  const reset=()=>{l.style.display=d.style.display='none';hv.textContent=cx.cur;hl.innerHTML=cx.lab};
  if(!ev){reset();return}
  const r=ev.currentTarget.getBoundingClientRect(),x=Math.max(0,Math.min(cx.W,ev.clientX-r.left)),t=cx.s+x/cx.W*(cx.e-cx.s),v=vAt(t);
  if(v==null){reset();return}
  l.setAttribute('x1',x);l.setAttribute('x2',x);d.setAttribute('cx',x);d.setAttribute('cy',cx.Y(v));
  l.style.display=d.style.display='';
  hv.textContent=gbp(v);hl.textContent=fd(t,1);
}
function logAum(){
  const t=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),k="onkeydown=\"if(event.key==='Enter')saveAum()\"";
  $('#md').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="box"><b style="font-size:15px">Log AUM</b><p>Enter the total assets under management on a date.</p>
    <input id="av" type="number" inputmode="decimal" min="0" placeholder="Amount (${CUR})" ${k}><input id="ad" type="date" value="${t}"><input id="an" placeholder="Note (optional)" ${k}>
    <div class="btns"><button class="t" onclick="saveAum()">Save</button><button class="t" onclick="$('#md').innerHTML=''">Cancel</button></div></div></div>`;
  setTimeout(()=>{const i=$('#av');if(i)i.focus()},0);
}
function saveAum(){
  const v=parseFloat($('#av').value),d=$('#ad').value;
  if(!(v>=0)||!d){alert('Enter an amount and a date.');return}
  aum().push({id:uid(),t:new Date(d+'T12:00').getTime(),v,note:$('#an').value.trim()});
  data.aum.sort((a,b)=>a.t-b.t);$('#md').innerHTML='';save();render();
}
function delAum(id){if(!confirm('Delete this update?'))return;data.aum=aum().filter(x=>x.id!==id);save();render()}

addEventListener('resize',()=>{if(!edit&&!desc)render()});
render();init();
</script>
